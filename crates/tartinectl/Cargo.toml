[package]
name = "tartinectl"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tartinectl"
path = "src/main.rs"

[dependencies]
tartine-proto = { path = "../tartine-proto" }
# For crates/tartine-core/src/redundancy_spec.rs — parsing a
# human-friendly "hdd,ssd" spec into a RedundancyScheme client-side, so
# the kernel module never has to parse this grammar over the structured
# ioctl path (DESIGN.md §10).
tartine-core = { path = "../tartine-core" }
# tartine-fuse owns the ioctl wire format (numbers + wire structs) that
# both the kernel module and the FUSE prototype implement identically
# (IMPLEMENTATION_PLAN.md P1.6) — reused here rather than redefined.
tartine-fuse = { path = "../tartine-fuse" }
libc = "0.2"

# clap for a real build's argument parsing.
